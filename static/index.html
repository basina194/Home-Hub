  <!-- SCRIPT -->
  <script>
    let activeTab = 'home';
    let appPin = localStorage.getItem('nexus_app_pin') || '9045';
    let socket = null;
    let completedOpen = true;
    
    // In-memory data store for 0ms OPTIMISTIC UI
    let shoppingItems = [];
    let bizTasks = [];

    // Client-side NLP Polish Item Parser (parses "2 mleka", "jajka 10", "chleb 2 szt", "2x chleb")
    function parsePolishItem(raw) {
      raw = (raw || '').trim();
      if (!raw) return { item: '', quantity: '1' };

      if (raw.includes(' - ')) {
        const parts = raw.split(' - ');
        return { item: parts[0].trim(), quantity: parts.slice(1).join(' - ').trim() };
      }

      const knownUnits = new Set([
        'x', 'szt', 'sztuk', 'sztuki', 'op', 'opak', 'opakowanie', 'opakowania', 'opakowań',
        'kg', 'g', 'dag', 'l', 'litr', 'litry', 'litrow', 'litrów', 'butelka', 'butelki', 'butelek',
        'puszka', 'puszki', 'puszek', 'karton', 'kartony', 'kartonów', 'zgrzewka', 'zgrzewki', 'zgrzewek'
      ]);

      // 1. Liczba na początku: "2 mleka", "2x chleb", "2 kg mąki"
      const matchStart = raw.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]{1,10})?\s+(.+)$/);
      if (matchStart) {
        const num = matchStart[1].replace(',', '.');
        const unit = matchStart[2];
        const rest = matchStart[3].trim();
        if (unit && knownUnits.has(unit.toLowerCase())) {
          return { item: rest, quantity: unit.toLowerCase() === 'x' ? `${num} szt.` : `${num} ${unit}` };
        } else if (!unit) {
          return { item: rest, quantity: num };
        }
      }

      // 2. Liczba na końcu: "jajka 10", "chleb 2 szt", "mleko 2"
      const matchEnd = raw.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*([a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]{1,10})?$/);
      if (matchEnd) {
        const item = matchEnd[1].trim();
        const num = matchEnd[2].replace(',', '.');
        const unit = matchEnd[3];
        if (unit && knownUnits.has(unit.toLowerCase())) {
          return { item: item, quantity: `${num} ${unit}` };
        } else if (!unit) {
          return { item: item, quantity: num };
        }
      }

      return { item: raw, quantity: '1' };
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-App-Pin': appPin
      };
    }

    function changePinPrompt() {
      const newPin = prompt('Wprowadź kod PIN aplikacji (np. 9045):', appPin);
      if (newPin) {
        appPin = newPin.trim();
        localStorage.setItem('nexus_app_pin', appPin);
        refreshAllData();
      }
    }

    // Wymuszone czyszczenie cache PWA
    async function forceAppRefresh() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let r of registrations) {
          await r.unregister();
        }
      }
      window.location.reload(true);
    }

    function setTab(tab) {
      activeTab = tab;
      const homeSec = document.getElementById('section-home');
      const bizSec = document.getElementById('section-biz');
      const dHomeBtn = document.getElementById('tab-btn-home');
      const dBizBtn = document.getElementById('tab-btn-biz');

      if (tab === 'home') {
        homeSec.classList.remove('hidden');
        bizSec.classList.add('hidden');
        dHomeBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
        dBizBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all text-slate-400 hover:text-white";
      } else {
        homeSec.classList.add('hidden');
        bizSec.classList.remove('hidden');
        dBizBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-600/30";
        dHomeBtn.className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all text-slate-400 hover:text-white";
      }
    }

    // --- POGODA ---
    async function fetchWeather() {
      try {
        const res = await fetch('/api/home/weather', { headers: getHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        const cur = data.current || {};
        const daily = data.daily || {};

        const temp = cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m) : '--';
        const wind = cur.wind_speed_10m !== undefined ? cur.wind_speed_10m : '--';
        const rain = daily.precipitation_probability_max?.[0] ?? 0;

        document.getElementById('weather-temp').innerText = `${temp}°C`;
        document.getElementById('weather-rain').innerText = `💧 ${rain}% opadów`;
        document.getElementById('weather-wind').innerText = `Wiatr ${wind} km/h`;
      } catch (e) {
        console.log('Weather offline');
      }
    }

    // --- ZAKUPY (0ms OPTIMISTIC UI) ---
    async function fetchShopping(showLoading = false) {
      const activeList = document.getElementById('shopping-active-list');
      if (showLoading && shoppingItems.length === 0) {
        activeList.innerHTML = '<div class="text-slate-500 text-sm py-8 text-center animate-pulse">Ładowanie produktów...</div>';
      }

      try {
        const res = await fetch('/api/home/shopping', { headers: getHeaders() });
        if (res.status === 401) {
          activeList.innerHTML = `
            <div class="text-rose-400 text-sm py-6 text-center space-y-2">
              <div>⚠️ Wymagany PIN (9045).</div>
              <button onclick="changePinPrompt()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold shadow">
                🔑 Wprowadź PIN
              </button>
            </div>
          `;
          return;
        }
        if (!res.ok) return;

        const items = await res.json();
        if (Array.isArray(items)) {
          shoppingItems = items;
          renderShoppingList();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function toggleCompletedSection() {
      completedOpen = !completedOpen;
      const compList = document.getElementById('shopping-completed-list');
      const arrow = document.getElementById('completed-arrow');
      if (completedOpen) {
        compList.classList.remove('hidden');
        arrow.innerText = '▾';
      } else {
        compList.classList.add('hidden');
        arrow.innerText = '▸';
      }
    }

    function renderShoppingList() {
      const activeList = document.getElementById('shopping-active-list');
      const completedList = document.getElementById('shopping-completed-list');
      const completedWrapper = document.getElementById('completed-wrapper');
      const badgeCount = document.getElementById('shopping-badge-count');
      const completedLabel = document.getElementById('completed-count-label');

      const activeItems = shoppingItems.filter(i => !i.is_bought);
      const completedItems = shoppingItems.filter(i => !!i.is_bought);

      badgeCount.innerText = activeItems.length;

      // Active items
      if (activeItems.length === 0) {
        activeList.innerHTML = `
          <div class="text-center py-10 px-4 rounded-2xl bg-white/[0.02] border border-white/[0.04]">
            <div class="text-3xl mb-1.5">🎉</div>
            <div class="font-bold text-sm text-slate-200">Wszystko kupione!</div>
            <div class="text-xs text-slate-500 mt-0.5">Wpisz produkt powyżej lub napisz na Telegramie.</div>
          </div>
        `;
      } else {
        activeList.innerHTML = activeItems.map(item => renderItemRow(item, false)).join('');
      }

      // Completed items
      if (completedItems.length > 0) {
        completedWrapper.classList.remove('hidden');
        completedLabel.innerText = `Kupione (${completedItems.length})`;
        completedList.innerHTML = completedItems.map(item => renderItemRow(item, true)).join('');
      } else {
        completedWrapper.classList.add('hidden');
      }
    }

    function renderItemRow(item, isBought) {
      const isWife = item.added_by && item.added_by.toLowerCase().includes('żona');

      return `
        <div class="group flex items-center justify-between p-3 rounded-2xl border transition-all duration-150 ${
          isBought 
            ? 'bg-white/[0.015] border-white/[0.03] opacity-45' 
            : 'bg-[#0d0f17] hover:bg-[#121521] border-white/[0.06] shadow-sm'
        }">
          
          <!-- Tap area -->
          <div class="flex items-center gap-3 cursor-pointer flex-1 min-w-0" onclick="toggleShoppingItem(${item.id})">
            
            <!-- Checkbox circle -->
            <div class="w-6 h-6 rounded-full flex items-center justify-center transition-all duration-150 flex-shrink-0 ${
              isBought 
                ? 'bg-emerald-500 border-2 border-emerald-500 text-black shadow-sm' 
                : 'border-2 border-slate-700 bg-slate-900/60 group-hover:border-indigo-400'
            }">
              ${isBought ? `
                <svg class="w-3.5 h-3.5 text-black font-extrabold stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
              ` : ''}
            </div>

            <!-- Title & Quantity -->
            <div class="flex flex-wrap items-baseline gap-2 min-w-0">
              <span class="text-sm font-bold tracking-tight transition-all duration-150 ${
                isBought ? 'line-through text-slate-500' : 'text-slate-100 group-hover:text-white'
              }">
                ${escapeHtml(item.item)}
              </span>
              
              ${item.quantity && item.quantity !== '1' ? `
                <span class="text-[11px] font-mono font-bold px-2 py-0.5 rounded-lg bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">
                  ${escapeHtml(item.quantity)}
                </span>
              ` : ''}
            </div>
          </div>

          <!-- Badges & Trash icon -->
          <div class="flex items-center gap-2 flex-shrink-0 ml-2">
            ${isWife ? `
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-300 border border-rose-500/30 flex items-center gap-1 shadow-sm">
                🌸 Żona
              </span>
            ` : (item.added_by && item.added_by !== 'Panel' ? `
              <span class="text-[10px] font-semibold text-slate-400 bg-white/[0.04] border border-white/[0.08] px-2 py-0.5 rounded-md">
                ${escapeHtml(item.added_by)}
              </span>
            ` : '')}

            <button onclick="deleteSingleItem(event, ${item.id})" title="Usuń" class="opacity-30 group-hover:opacity-100 p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>

        </div>
      `;
    }

    // 0ms TOGGLE
    function toggleShoppingItem(id) {
      const item = shoppingItems.find(i => i.id === id);
      if (!item) return;

      if ('vibrate' in navigator) navigator.vibrate(10);

      item.is_bought = !item.is_bought;
      renderShoppingList();

      fetch(`/api/home/shopping/${id}/toggle`, {
        method: 'PATCH',
        headers: getHeaders()
      }).catch(() => {
        item.is_bought = !item.is_bought;
        renderShoppingList();
      });
    }

    function quickAdd(phrase) {
      const parsed = parsePolishItem(phrase);
      addItemOptimistic(parsed.item, parsed.quantity);
    }

    function handleShoppingSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('shopping-input');
      const text = input.value.trim();
      if (!text) return;

      // Inteligentne parsowanie: "2 mleka", "jajka 10", "chleb"
      const parsed = parsePolishItem(text);
      addItemOptimistic(parsed.item, parsed.quantity);
      input.value = '';
    }

    function addItemOptimistic(itemName, quantity) {
      const tempId = 'temp_' + Date.now();
      const optimisticItem = {
        id: tempId,
        item: itemName,
        quantity: quantity || '1',
        category: 'Wszystko',
        is_bought: false,
        added_by: 'Panel'
      };

      shoppingItems.unshift(optimisticItem);
      renderShoppingList();
      if ('vibrate' in navigator) navigator.vibrate(15);

      fetch('/api/home/shopping', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ item: itemName, quantity: quantity || '1', category: 'Wszystko', added_by: 'Panel' })
      }).then(() => {
        fetchShopping(false);
      }).catch(err => {
        shoppingItems = shoppingItems.filter(i => i.id !== tempId);
        renderShoppingList();
        alert('Błąd zapisu produktu: ' + err.message);
      });
    }

    // 0ms DELETE
    function deleteSingleItem(e, id) {
      e.stopPropagation();
      const item = shoppingItems.find(i => i.id === id);
      if (!item) return;

      const previousState = [...shoppingItems];
      shoppingItems = shoppingItems.filter(i => i.id !== id);
      renderShoppingList();
      if ('vibrate' in navigator) navigator.vibrate(8);

      fetch(`/api/home/shopping/${id}`, {
        method: 'DELETE',
        headers: getHeaders()
      }).catch(() => {
        shoppingItems = previousState;
        renderShoppingList();
      });
    }

    // 0ms CLEAR BOUGHT
    function clearBoughtItems() {
      const boughtCount = shoppingItems.filter(i => i.is_bought).length;
      if (boughtCount === 0) return;
      if (!confirm(`Usunąć ${boughtCount} kupionych pozycji?`)) return;

      const previousState = [...shoppingItems];
      shoppingItems = shoppingItems.filter(i => !i.is_bought);
      renderShoppingList();
      if ('vibrate' in navigator) navigator.vibrate([10, 30, 10]);

      fetch('/api/home/shopping/clear-bought', {
        method: 'DELETE',
        headers: getHeaders()
      }).catch(() => {
        shoppingItems = previousState;
        renderShoppingList();
      });
    }

    // --- MODUŁ FIRMA (OPTIMISTIC UI) ---
    async function fetchBizTasks() {
      const container = document.getElementById('biz-tasks-list');
      try {
        const res = await fetch('/api/biz/tasks', { headers: getHeaders() });
        if (res.status === 401) return;
        if (!res.ok) return;
        const tasks = await res.json();
        if (Array.isArray(tasks)) {
          bizTasks = tasks;
          renderBizTasks();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderBizTasks() {
      const container = document.getElementById('biz-tasks-list');
      const total = bizTasks.length;
      const todo = bizTasks.filter(t => t.status !== 'Done').length;
      const urgent = bizTasks.filter(t => t.priority === 'Krytyczny' && t.status !== 'Done').length;

      document.getElementById('biz-total-count').innerText = total;
      document.getElementById('biz-todo-count').innerText = todo;
      document.getElementById('biz-urgent-count').innerText = urgent;

      if (total === 0) {
        container.innerHTML = '<div class="text-slate-500 text-sm py-8 text-center">Brak spraw w rejestrze. Dobra robota! ☕</div>';
        return;
      }

      container.innerHTML = bizTasks.map(task => {
        const isDone = task.status === 'Done';
        const isUrgent = task.priority === 'Krytyczny';
        return `
          <div class="p-3.5 rounded-2xl border transition-all ${
            isDone 
              ? 'bg-white/[0.015] border-white/[0.03] opacity-45' 
              : (isUrgent 
                  ? 'bg-rose-500/[0.08] border-rose-500/30' 
                  : 'bg-[#0d0f17] border-white/[0.06]')
          } flex items-center justify-between gap-3">
            <div class="flex items-start gap-3 flex-1 min-w-0 cursor-pointer" onclick="toggleBizTask(${task.id})">
              <div class="mt-0.5 w-5 h-5 rounded-lg flex items-center justify-center border transition-all ${
                isDone 
                  ? 'bg-indigo-600 border-indigo-600 text-white' 
                  : 'border-slate-700 bg-slate-900'
              }">
                ${isDone ? '✓' : ''}
              </div>
              <div class="min-w-0 flex-1">
                <div class="text-sm font-bold text-slate-100 truncate ${isDone ? 'line-through text-slate-500' : ''}">
                  ${escapeHtml(task.client_name)}
                </div>
                <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                  <span>${escapeHtml(task.task_type)}</span>
                  <span>•</span>
                  <span class="font-mono text-slate-400">${escapeHtml(task.due_date)}</span>
                </div>
              </div>
            </div>
            <div>
              <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${
                isUrgent ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40 animate-pulse' : 
                (task.priority === 'Wysoki' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-white/[0.04] text-slate-400 border border-white/[0.08]')
              }">
                ${escapeHtml(task.priority)}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleBizTask(id) {
      const task = bizTasks.find(t => t.id === id);
      if (!task) return;
      if ('vibrate' in navigator) navigator.vibrate(10);

      task.status = task.status === 'Done' ? 'Todo' : 'Done';
      renderBizTasks();

      fetch(`/api/biz/tasks/${id}/done`, {
        method: 'PATCH',
        headers: getHeaders()
      }).catch(() => {
        task.status = task.status === 'Done' ? 'Todo' : 'Done';
        renderBizTasks();
      });
    }

    function handleBizSubmit(e) {
      e.preventDefault();
      const client = document.getElementById('biz-client').value.trim();
      const type = document.getElementById('biz-type').value;
      const date = document.getElementById('biz-date').value;
      const priority = document.getElementById('biz-priority').value;

      fetch('/api/biz/tasks', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          client_name: client,
          task_type: type,
          due_date: date,
          priority: priority
        })
      }).then(() => {
        document.getElementById('biz-client').value = '';
        fetchBizTasks();
      }).catch(err => {
        alert('Błąd dodawania zadania: ' + err.message);
      });
    }

    // --- WEBSOCKETS (LIVE SYNC) ---
    function initWebSocket() {
      const indicator = document.getElementById('ws-indicator');
      const status = document.getElementById('ws-status');

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        indicator.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50";
        status.innerText = "Na żywo";
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.action === 'refresh') {
            if (msg.module === 'shopping') fetchShopping(false);
            if (msg.module === 'biz') fetchBizTasks();
          }
        } catch (e) {
          console.error('WS Parse error', e);
        }
      };

      socket.onclose = () => {
        indicator.className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
        status.innerText = "Ponawianie...";
        setTimeout(initWebSocket, 3500);
      };

      socket.onerror = () => {
        socket.close();
      };
    }

    function refreshAllData() {
      fetchWeather();
      fetchShopping(true);
      fetchBizTasks();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto-update Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=4').then(reg => {
        reg.update();
      }).catch(err => console.log('SW fail:', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Date in Polish
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('pl-PL', options).toUpperCase();
      const dateEl = document.getElementById('header-date');
      if (dateEl) dateEl.innerText = dateStr;

      const todayIso = now.toISOString().split('T')[0];
      const taskDateEl = document.getElementById('biz-date');
      if (taskDateEl) taskDateEl.value = todayIso;

      initWebSocket();
      refreshAllData();
      setInterval(fetchWeather, 300000);
    });
  </script>
</body>
</html>
